pull_request_rules:
  - name: Backport merged PRs from main → stable (skip .tekton-only changes)
    conditions:
      - base=main
      - merged
      - author!=mergify[bot]
      - repository-full-name=opendatahub-io/fms-guardrails-orchestrator
      - files~=^(?!\.tekton/).+
    actions:
      backport:
        branches:
          - stable
        ignore_conflicts: true
        labels:
          - bot/sync-stable
        title: "[stable] {{ title }}"
        body: |
          Backport of #{{ number }} — {{ title }}

          This PR cherry-picks the changes from `main` into `stable`.
